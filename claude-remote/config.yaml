name: Claude Remote
version: "0.1.0"
slug: claude_remote
description: Claude Code Remote Control server next to Home Assistant
url: https://github.com/voriux/ha-addons/tree/main/claude-remote
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: Claude
# The claude user's token (via MCP) is the only HA access; the Supervisor token would be admin.
homeassistant_api: false
hassio_api: false
map:
  - type: homeassistant_config
    read_only: true
backup_exclude:
  - .claude/.credentials.json
options:
  session_name: ha
  spawn: worktree
  permission_mode: default
  capacity: 3
  repositories:
    - voriux/ha-control
schema:
  session_name: str
  spawn: list(same-dir|worktree|session)
  # bypassPermissions is left out on purpose: this process has a shell on the box that runs the house.
  permission_mode: list(default|acceptEdits|plan|auto|dontAsk)
  capacity: int(1,8)
  repositories:
    - match(^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$)
  ha_token: password?
  github_token: password?
  webhook_id: password?
